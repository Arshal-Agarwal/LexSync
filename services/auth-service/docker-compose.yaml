version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres-db

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
      POSTGRES_DB: lexsync

volumes:
  postgres_data: